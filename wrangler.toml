# uuidna.com — a static site served by Cloudflare Workers Assets.
# `wrangler deploy` runs the [build] command below to GENERATE ./site (VitePress → outDir 'site'), then serves it.
# The site dir is gitignored and not in the repo, so the build MUST run here — `npm run build` alone is only `tsc`
# and never produces ./site (that was the "assets.directory does not exist" deploy failure). docs:build does tsc +
# the MCP catalog + `vitepress build` → ./site.
name = "uuidna"
compatibility_date = "2026-08-01"
# The edge worker enforces the license domain rule: uuidna.com licenses itself and auto-licenses the first-party
# wildcard *.uuidna.{com,net,org}; every other, unlicensed host is redirected to the canonical uuidna.com. See
# worker.js and docs/license.md. Remove this line (and run_worker_first below) to revert to plain static assets.
main = "worker.js"

[build]
command = "npm run docs:build"

# Trial CRUD storage (opt-in). POST /trials persists a trial ONLY with explicit consent, into this KV namespace.
# Until a namespace exists the worker still computes and returns trials — it just cannot persist them. To enable
# storage: `wrangler kv namespace create TRIALS`, then uncomment below and paste the returned id.
# [[kv_namespaces]]
# binding = "TRIALS"
# id = "REPLACE_WITH_THE_ID_FROM_wrangler_kv_namespace_create"

[assets]
directory = "./site"
binding = "ASSETS" # worker.js delegates the serve path to env.ASSETS.fetch
run_worker_first = true # intercept EVERY request by Host first (even asset hits), then serve or redirect
# clean URLs: /captain/message resolves to ./site/captain/message/index.html
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
