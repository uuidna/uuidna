# uuidna.com — a static site served by Cloudflare Workers Assets.
# `wrangler deploy` runs the [build] command below, which VERIFIES ./docs/.vitepress/dist (the DEFAULT VitePress
# outDir) is already built and then generates the handle routes. It does NOT run the SSG: rendering 5260 dynamic
# pages peaks at 7.75–8.56 GB of RSS and a deploy container has 8 GiB, so a build here can only OOM. Deploy from
# the machine that has the memory — `npm run ship` (deploy-run.ts) builds the site, then uploads with
# UUIDNA_SITE_BUILT=1, and keeps the contribute-first, origin-only and double-proof laws besides.
name = "uuidna"
compatibility_date = "2026-08-01"
# The edge worker enforces the license domain rule: uuidna.com licenses itself and auto-licenses the first-party
# wildcard *.uuidna.{com,net,org}; every other, unlicensed host is redirected to the canonical uuidna.com. See
# worker.js and docs/license.md. Remove this line (and run_worker_first below) to revert to plain static assets.
main = "worker.js"

[build]
# ship-build.ts: refuses in milliseconds when the dist is absent (a container cannot afford the SSG); otherwise
# gen-handles only. UUIDNA_SITE_BUILT is no longer consulted — the dist itself is the reading.
command = "node dist/scripts/ship-build.js"

# Trial CRUD storage (opt-in). POST /trials persists a trial ONLY with explicit consent, into this KV namespace.
# Until a namespace exists the worker still computes and returns trials — it just cannot persist them. To enable
# storage: `wrangler kv namespace create TRIALS`, then uncomment below and paste the returned id.
# [[kv_namespaces]]
# binding = "TRIALS"
# id = "REPLACE_WITH_THE_ID_FROM_wrangler_kv_namespace_create"

# Trial signing key (a secret, NOT stored here). `wrangler secret put TRIAL_KEY` — the worker HMAC-SHA256s each
# trial verdict with it, so only uuidna.com can sign an authoritative trial (a fork recomputes the same verdict but
# cannot forge the signature). Until the secret is set, trials return unsigned (valid by recomputation only).

[assets]
directory = "./docs/.vitepress/dist"
binding = "ASSETS" # worker.js delegates the serve path to env.ASSETS.fetch
run_worker_first = true # intercept EVERY request by Host first (even asset hits), then serve or redirect
# clean URLs: /theorems resolves to ./docs/.vitepress/dist/theorems.html (cleanUrls) or its index.html
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
