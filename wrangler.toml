# uuidna.com — a static site served by Cloudflare Workers Assets.
# `wrangler deploy` runs the [build] command below to GENERATE ./site (VitePress → outDir 'site'), then serves it.
# The site dir is gitignored and not in the repo, so the build MUST run here — `npm run build` alone is only `tsc`
# and never produces ./site (that was the "assets.directory does not exist" deploy failure). docs:build does tsc +
# the MCP catalog + `vitepress build` → ./site.
name = "uuidna"
compatibility_date = "2026-08-01"

[build]
command = "npm run docs:build"

[assets]
directory = "./site"
# clean URLs: /captain/message resolves to ./site/captain/message/index.html
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
