# AUTOMATE BOOKS — READ FOR SPEED AND QUALITY (the captain's order: "improve speed and quality by reading books").
# fetchGutenberg caches under .uuidna-books/ (warm re-reads skip the network). mine-books files every numeric
# claim the corpus STATES into book-leads.json; books-run links each CORPUS edition to the sealed ledger and
# deposits VERIFIED novel Nat facts into lean/wave-queue.json pending — the desk proposes; wave.yml / the kernel
# disposes. Never auto-seals. Never deploys.
name: books
on:
  schedule:
    # once a day, offset from wave (:41) and next (:11)
    - cron: '27 9 * * *'
  workflow_dispatch:
    inputs:
      dry:
        description: 'Report novel candidates without depositing to the wave queue'
        type: boolean
        default: false

concurrency:
  group: books
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  books:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - name: install exact (lockfile law)
        run: npm ci
      # THE SIGNING GATE LIVES IN hooks/, AND A FRESH CHECKOUT DOES NOT KNOW THAT (2026-09-01). Measured over the
      # 27 commits since the entry-guard fix: 3 unsigned, ALL of them from workflow bots, ZERO from the
      # workstation. The gate was never broken here — it was never installed. actions/checkout writes a bare
      # .git with hooks disabled, so commit-msg never ran and every bot commit landed without a Trial-Receipt.
      - name: install the signing gate (hooks are not checked out active)
        run: git config core.hooksPath hooks

      - name: identify the runner
        run: |
          git config user.name  'uuidna books'
          git config user.email 'books@uuidna.com'
      - name: "leads:books — mine candidate leads, cache fetches, deposit novel decides"
        env:
          DRY: ${{ inputs.dry }}
        run: |
          npm run build
          node dist/scripts/mine-books.js
          if [ "$DRY" = "true" ]; then node dist/scripts/books-run.js --dry; else node dist/scripts/books-run.js; fi
      - name: land derived book leads, quality report, and pending wave (explicit paths only)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry != true }}
        run: |
          git add book-leads.json books-quality.json lean/wave-queue.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "::notice::books — nothing new to land (quiet is health)"
            exit 0
          fi
          git commit -m "$(cat <<'EOF'
          Books pass: cache-warmed reads and novel Nat facts queued for the wave.

          Backed by theorem silence_never_refutes and theorem provenance_integrity_not_content_truth
          EOF
          )"
          git push origin HEAD || echo "::warning::push refused — another writer holds main; queue is local until next tick"
      - name: name the outcome
        if: always()
        run: npm run state || echo "::warning::state unreadable"
