# AUTOMATE NEXT — THE READINESS CLOCK (the captain's order: "push and automate next").
# wave.yml conveys the queue; release.yml delivers on a tag; this clock runs the 777 self-trial
# (`npm run next` — hexbit-fast O(1) from the sealed fixed point) so readiness is watched
# without inventing theorems or cutting a release.
#
# WHAT IT DOES NOT DO, ON PURPOSE:
#   · It does not INVENT. next only re-reads the seal; new claims need an author and the wave.
#   · It does not TAG / PUBLISH / ZENODO. Delivery stays captain-gated (leads-gate + release.yml).
#   · It does not DEPLOY. ship/deploy ride their own gates.
#   · It does not RACE wave. Concurrency group is separate; cron is offset from wave's :41.
name: next
on:
  schedule:
    # twice a day, offset from wave (07:41 / 19:41) so the clocks never share a minute
    - cron: '11 8 * * *'
    - cron: '11 20 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: 'Run the full O(N) `npm run next:full` instead of hexbit-fast `npm run next`'
        type: boolean
        default: false

concurrency:
  group: next
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  next:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - name: install exact (lockfile law)
        run: npm ci
      - name: install lean toolchain (full next re-proves; verify still needs the seal tools)
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: "next — hexbit-fast verify, or full self-trial when dispatched with full=true"
        env:
          FULL: ${{ inputs.full }}
        run: |
          if [ "$FULL" = "true" ]; then
            npm run next:full
          else
            npm run next
          fi
      - name: name the outcome (a silent runner is a runner nobody can audit)
        if: always()
        run: npm run state || echo "::warning::state unreadable — next stopped before the tree settled"
