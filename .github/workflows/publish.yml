name: publish

# Publish @uuidna/uuidna to npm when a version tag (vX.Y.Z) is pushed.
# Requires a repo secret NPM_TOKEN (an npm "Automation" token). Build and tests must pass first;
# a failing test fails the publish, not production. Integrity, not truth. 0/7.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm provenance (public supply-chain attestation)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Guard — tag must match package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          test "$TAG" = "$PKG" || { echo "::error::tag v$TAG != package.json $PKG"; exit 1; }
      - name: Build
        run: npm run build
      - name: Test
        run: node --test test/smoke.test.mjs
      - name: Publish (public, with provenance)
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
