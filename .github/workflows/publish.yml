name: publish

# Publish @uuidna/uuidna to npm when a v0.[integer].[digit] tag is pushed (or on manual dispatch).
# TOKEN-FREE via OIDC Trusted Publishing (set on npmjs.com → the package's Settings → Trusted Publisher: GitHub
# Actions, repo uuidna/uuidna, workflow publish.yml). No NPM_TOKEN secret — GitHub's OIDC id-token is exchanged for
# a short-lived publish credential, so no 2FA-bypassing token is stored anywhere. The COMPLETE audit runs first, as
# the package's own prepublishOnly gate — a failing audit fails the publish, never production. Integrity, not truth.
#
# The audit is SEVEN recomputable dimensions (echoing the ℤ/7 rosette — the honest reading of "3×7 / 777": three
# sevens, 3×7 = 21, a mnemonic, NOT 777 of anything), each of which can FAIL the deploy:
#   1. build            — tsc type integrity
#   2. lean             — every theorem re-proven `by decide`, sorry-free (Lean 4.33.0, pinned by lean-toolchain)
#   3. provenance       — the honesty gate: every prose claim linked/demarcated (claims:0), or fail
#   4. tests            — crypt-guard · KAT · pq · quantum · smoke (incl. the no-Math purity check) · stream
#   5. determinism      — regenerating the ledger from the proofs leaves the tree clean (git diff --exit-code)
#   6. version guards   — tag == package.json version, and the odometer v0.[integer].[digit], monotone for npm
#   7. npm provenance   — the published tarball carries a signed Sigstore attestation (--provenance, id-token)
# Dimensions 1–5 are `npm run gate-all` (also the local prepublishOnly gate — same scripts.audit chain,
# concurrent checks); 6–7 are added here for the deploy.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# One tag publishes at a time — a second calendar tick queues rather than interleaving npm/release/Zenodo writes.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

# THE FLOOR IS READ-ONLY, and the two jobs that need more already say so at the job level, where the grant sits next
# to the step that spends it: `publish` adds id-token: write for OIDC trusted publishing and Sigstore provenance,
# `extension` adds contents: write for `gh release`. The other three — editorial, live, zenodo — only read the tree
# and talk to services holding their own secrets (Zenodo's ZENODO_ACCESS_TOKEN, the live site over plain HTTP), so
# they had no reason to hold a writable repository token and now cannot (actions/missing-workflow-permissions).
# This narrows what a compromised dependency reaches during `npm install` on a workflow that publishes to npm and
# mints DOIs; it grants nothing new, so the jobs that already declared their needs are unaffected.
permissions:
  contents: read

jobs:
  # THE EDITORIAL DESK — every editorial skill and procedure runs BEFORE any publication, automatically: the
  # provenance audit (no fabricated citation on any prose surface), the citation ledger, the prose receipt, the
  # legal receipt, and the prose trials (every paragraph through reveal(); a single DRAINED verdict refuses the
  # release). One npm script (`npm run editorial`) so the same desk sits locally and here — nothing publishes
  # unedited. Integrity, not truth: the desk verifies citations and scope, it does not decide what is true.
  editorial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }   # a wing reads a committed definition from history (lean-involutions, 7a54411e)
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Install deps
        run: npm install --no-audit --no-fund
      - name: The editorial desk — all editorial skills and procedures, or no publication
        run: npm run editorial
      - name: Pre-publish seal — thesis audit · Lean format · VE involutions · finite infinities
        run: npm run prepublish-seal

  publish:
    runs-on: ubuntu-latest
    needs: editorial
    # the release's own ledger fold, handed to `live` so it can tell THIS deployment from the previous one
    # without checking the repo out again — publish has already built dist by the time it is read.
    outputs:
      feed_id: ${{ steps.feed_id.outputs.id }}
    permissions:
      contents: read
      id-token: write # dual use: OIDC trusted-publishing auth (token-free) + the Sigstore provenance attestation
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }   # a wing reads a committed definition from history (lean-involutions, 7a54411e)
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'

      # OIDC Trusted Publishing needs npm >= 11.5.1. Node 22 shipped npm 10.9 and had to reinstall the CLI on
      # every publish; Node 26 ships 11.19, so the requirement is met by the pinned runtime and the reinstall is
      # pure recompute. Verify O(1) instead — the requirement stays ASSERTED BY NAME (a future runtime that
      # regressed below it fails here with its reason, never as an opaque auth error at publish time).
      - name: npm meets the OIDC floor (>= 11.5.1) — asserted, not reinstalled
        run: |
          set -euo pipefail
          NPM=$(npm --version)
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number);const ok=a>11||(a===11&&(b>5||(b===5&&c>=1)));if(!ok){console.error(`::error::npm ${process.argv[1]} is below the OIDC trusted-publishing floor 11.5.1 — pin a newer node-version or reinstall the CLI`);process.exit(1)}' "$NPM"
          echo "npm $NPM meets the OIDC floor 11.5.1"

      - name: Install Lean (elan, toolchain pinned by lean-toolchain)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Warm the pinned toolchain
        run: lean --version # reads lean-toolchain, installs v4.33.0 so `npm run lean` can verify

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Guard — tag matches package.json version, single-digit odometer
        if: startsWith(github.ref, 'refs/tags/') # a tag push, or the research desk dispatching on a fresh tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          test "$TAG" = "$PKG" || { echo "::error::tag v$TAG != package.json $PKG"; exit 1; }
          # THE ODOMETER IS v0.[integer].[digit] — enforced here too, because a tag can be pushed by hand: MAJOR
          # locked at 0 (a major tick is the captain's statement about maturity, never a pipeline's), MINOR an
          # unbounded integer (the calendar never fills), PATCH one digit (ten patches roll a minor). Nothing
          # outside that shape publishes: not to npm, not to the release, not to the archive.
          echo "$TAG" | grep -Eq '^0\.[0-9]+\.[0-9]$' || { echo "::error::v$TAG breaks the odometer v0.[integer].[digit] — major must be 0 (the v0 lock), minor any integer, patch one digit 0..9 stepping linearly — npm orders by semver, so the version must increase"; exit 1; }

      # NO PUBLICATION OVER AN OPEN LEAD. `npm publish` runs prepublishOnly (the whole audit), which decides
      # whether the tree is GREEN. This decides whether it is FINISHED — a different question, and the one that
      # matters here because this job mints a permanent DOI. A lead is anything not verified, and it is settled
      # by evidence (a `by decide` seal, a measurement in killed_by, a boundary in refused[]) and never by
      # deletion, so this cannot be cleared by tidying before a tag.
      #
      # It runs BEFORE npm publish deliberately: npm can be deprecated and a GitHub release deleted, but a Zenodo
      # DOI is permanent by design. The gate belongs in front of the step that cannot be taken back.
      #
      # A lead SOURCE that cannot be read blocks too — an unread source and a clean one both report no leads, and
      # shipping on a census nobody managed to take is exactly what this refuses (no_instrument_narrower_than_its_question).
      #
      # It builds first because nothing in this job has: the steps above install Lean and dependencies and check
      # the tag, and the only build is the one prepublishOnly runs INSIDE npm publish — after this. A step that
      # assumed dist existed would fail with "Cannot find module" and be read as a broken gate rather than a
      # missing build, which is the kind of failure that gets a gate removed rather than fixed.
      - name: "No publication over an open lead — the census must be clean AND complete"
        run: npm run build && node dist/scripts/leads-gate.js

      # Token-free: OIDC (id-token: write above) is exchanged for the publish credential; no NODE_AUTH_TOKEN.
      - name: Publish (public, token-free via OIDC, with provenance) — prepublishOnly runs the complete audit first
        run: npm publish --provenance --access public

  # The desktop extension ships itself: pack extension/ (one manifest — the standards-compression) into
  # uuidna.mcpb and attach it to the release, so every tag carries the one-click carrier of the receipted tools.
      - name: The release's ledger fold — the identity `live` waits for on the deployed site
        id: feed_id
        run: echo "id=$(node -e "import('./dist/scripts/gen-feed.js').then(m=>console.log(m.buildFeed()['@id']))")" >> "$GITHUB_OUTPUT"

  extension:
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }   # a wing reads a committed definition from history (lean-involutions, 7a54411e)
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Pack the desktop extension
        run: |
          npx -y @anthropic-ai/mcpb pack extension/
          mv extension.mcpb uuidna.mcpb
          shasum -a 256 uuidna.mcpb
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/') # a tag push, or the research desk dispatching on a fresh tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Immutable releases (GitHub 2025+): assets cannot be uploaded AFTER creation — the release must be
          # BORN carrying its asset. Create-with-asset when missing; when it already exists, uploading may 422
          # on an immutable release — report, never fail the pipeline over the carrier of an already-shipped tag.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" uuidna.mcpb --clobber || echo "::warning::release is immutable — uuidna.mcpb not attached (repack anytime: npx @anthropic-ai/mcpb pack extension/)"
          else
            # Born carrying the day's news: immutable releases take assets at birth only, so the extension AND
            # the trials' returns (the findings fold, the prose trials) ship in the create itself when present.
            ASSETS="uuidna.mcpb"
            for NEWS in quantum-fold.json prose-trials.json; do
              test -f "$NEWS" && ASSETS="$ASSETS $NEWS"
            done
            # Retried like the handoff, and for the same reason: measured 2026-08-17 on v0.1.5, GitHub answered
            # `503 No server is currently available` and the release was simply never born — npm had the version,
            # both archives had the DOI, and the tag had no Release at all. An outage is not a verdict.
            for ATTEMPT in 1 2 3 4 5; do
              gh release create "$GITHUB_REF_NAME" --generate-notes $ASSETS && exit 0
              echo "::warning::release create failed for $GITHUB_REF_NAME (attempt $ATTEMPT/5) — retrying"
              sleep $((ATTEMPT * 20))
              gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && { echo "::notice::$GITHUB_REF_NAME exists now — another attempt won the race"; exit 0; }
            done
            echo "::error::$GITHUB_REF_NAME published to npm and Zenodo but has NO GitHub Release after five attempts — create it by hand: gh release create $GITHUB_REF_NAME --generate-notes $ASSETS"
            exit 1
          fi

  # LIVE UI INDEPENDENCE — the second party. CI's own word is one coin; the DEPLOYED system's signed receipt is
  # the other. The live edge (uuidna.com/mcp, serving the ledger the site deployed on push) independently
  # recomputes: the gate must be CLEAN and match the sealed spec, and the release statement must return
  # VERIFIED from the live trial — a signed receipt from a party CI does not control. verdict≠VERIFIED or a
  # drained live gate fails the release loudly; the two computations and their receipts sit side by side in
  # the run log. Statistics: 2 assertions, 2 receipts, 1 statement, 0 authored verdicts.
  live:
    runs-on: ubuntu-latest
    needs: publish
    if: startsWith(github.ref, 'refs/tags/') # a tag push, or the research desk dispatching on a fresh tag
    steps:
      # WAIT FOR THE DEPLOYED SITE TO BE *THIS* RELEASE, not merely for a job to finish. deploy.yml runs in a
      # separate workflow, so `needs:` cannot reach it — and a cross-workflow timing dependency would only prove a
      # job ended, never that the right bytes are being served. The feed's @id content-addresses the WHOLE ledger
      # (gen-feed folds every theorem's lineAddress), so it changes if any theorem changes: comparing it to the
      # @id computed from the tag under test is a verification, not a proxy.
      # Before this, `live` could pass against the PREVIOUS deployment — its two checks (gate spec, trial verdict)
      # hold for any release, so neither could tell one deployment from another.
      # THE WAIT IS A SCRIPT, NOT SHELL HERE — src/scripts/await-live.ts, covered by src/tests/await-live.test.ts.
      # It lived inline and no test could reach it; hand-checking found a real hazard, since under `set -euo
      # pipefail` an unguarded failing curl aborts the step, so a site merely slow to answer would FAIL a release
      # rather than be retried. The script injects its probe and its sleep, so blocking, never-landing, unreachable
      # and already-current all run under node --test with no network — including the case a real release cannot
      # show, because v0.2.4's deploy finished 3m50s before this job started and the retry loop never spun.
      # It waits on CONTENT: the feed @id content-addresses the whole ledger, so it moves if any theorem moves.
      # node 26 runs the TypeScript directly, so this job needs the SOURCE and nothing else — no install, no build,
      # no dist. await-live.ts imports nothing from the package for exactly that reason.
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }   # a wing reads a committed definition from history (lean-involutions, 7a54411e)
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Wait until uuidna.com serves THIS release (feed @id == the tag's own ledger fold)
        run: |
          set -euo pipefail
          node src/scripts/await-live.ts https://uuidna.com/feed.json '${{ needs.publish.outputs.feed_id }}'
          # …and the BUILD, which the fold cannot answer: a scripts-only release leaves every theorem untouched,
          # so the @id is identical and a stale deployment is indistinguishable from a current one. 0.2.5 shipped
          # in exactly that state — the site published no version at all.
          # the tag is v0.2.5 while the manifest is 0.2.5 — strip the prefix, or the comparison never matches
          node src/scripts/await-live.ts https://uuidna.com/feed.json "${GITHUB_REF_NAME#v}" 20 15000 version

      - name: The live edge verifies the release — gate clean + trial VERIFIED, or fail
        run: |
          set -euo pipefail
          STATUS=$(curl -sf -X POST https://uuidna.com/mcp -H "Content-Type: application/json" -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"uuidna_gate_status","arguments":{}}}')
          echo "$STATUS" | jq -e '.result.content[0].text | fromjson | .matchesSealedSpec == true' > /dev/null || { echo "::error::live gate does not match the sealed spec — the deployed party refuses the release"; exit 1; }
          GATE_RECEIPT=$(echo "$STATUS" | jq -r '.result.content[0].text | fromjson | .receipt')
          TRIAL=$(curl -sf -X POST https://uuidna.com/mcp -H "Content-Type: application/json" -d '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"uuidna_trial","arguments":{"statement":"only the proven is admitted to a release, proven by theorem legal_only_the_proven_is_admitted"}}}')
          echo "$TRIAL" | jq -e '.result.content[0].text | fromjson | .verdict == "VERIFIED"' > /dev/null || { echo "::error::the live trial did not verify the release statement — verdict is not VERIFIED"; exit 1; }
          TRIAL_RECEIPT=$(echo "$TRIAL" | jq -r '.result.content[0].text | fromjson | .receipt')
          echo "::notice::live UI verified the release — gate_receipt=$GATE_RECEIPT trial_receipt=$TRIAL_RECEIPT verdict=VERIFIED parties=2"

  # The archive of record: every audit-passing release is deposited to Zenodo by API (ZENODO_ACCESS_TOKEN secret) —
  # a NEW VERSION of the standing record when the token owns it, a fresh deposition otherwise. Metadata is the
  # committed .zenodo.json (the single source — the description carries the era's verified discoveries and their
  # honest scope); the file is the tag's own source tarball. Gated on `publish`: only what the seven-dimension
  # audit certifies reaches the permanent DOI. Integrity, not truth — the DOI dates the WHAT, Zenodo dates the WHEN.
  # THE ARCHIVE DOI IS MINTED BY ZENODO FROM THE GITHUB RELEASE — there is no deposit job here any more.
  #
  # (the captain, 2026-09-26: "let zenodo mint the doi from github release. No need of redundancy".)
  #
  # WHAT WAS REMOVED AND WHY, measured that day. This workflow used to ALSO deposit through the Zenodo API, so every
  # release minted TWO records for one work, six seconds apart: 22256708 from the API deposit and 22256731 from the
  # GitHub integration, distinguishable by their own artefacts — a `0.3.0` tarball against a `v0.3.0` repo-prefixed
  # zip. Seventeen releases, thirty-four records. audit-doi-harvest refused every run because our record declared
  # isIdenticalTo the other chain and the other chain could not reciprocate, which is a dangling pointer rather than
  # a symmetric claim, and that refusal held the mint gate shut.
  #
  # AND THE SURVIVING CHAIN IS THE CITABLE ONE, which makes this a correction rather than a saving. The API
  # deposit versioned concept 21787143, which holds NINETEEN versions under THREE distinct titles — uuidna, the ℤ/9
  # Vortex Framework and the Clay Millennium Problems — because "New version" was used across different works, and a
  # concept DOI resolves to whichever was published last. src/zenodo-seals.ts had recorded that it "is NOT safe to
  # cite as ours" and left the untangling to the captain. The GitHub integration's chain 21970356 holds seventeen
  # versions under ONE title. Abandoning the polluted chain is better than untangling it.
  #
  # WHAT STILL DEPOSITS BY API: zenodo-seals below, for the PUBLICATIONS — monographs a source archive does not
  # cover. That is not redundant with the release; it is a different set of works.
  #
  # THE INTEGRATION FIRES ON THE RELEASE the `extension` job creates (`gh release create`), which is why `verify`
  # now waits on that job instead of on a deposit step in this file. Enabling the repository in Zenodo's GitHub
  # settings is an owner act done once, outside this workflow, and `verify` is what proves it happened.

  # Agnostic Zenodo publication seals — loops zenodo/manifest.json (clay-involution is one instance).
  # Metadata: zenodo/seals/<id>.json from gen-zenodo-seals (rich schema + canonical CC-BY-NC-ND-4.0).
  # THE RELEASE IS NOT DONE WHEN THE PUBLISH STEP EXITS — it is done when a stranger can install it and cite it.
  #
  # Every job above this one trusts its own exit code, and every gate in the repository reads the repository. That
  # combination has a blind spot with a measured cost: on 2026-09-25 package.json said 0.3.1 while npm's latest tag
  # and Zenodo's newest versioned record both said 0.3.0, and no v0.3.1 tag existed anywhere. A version had been
  # bumped and the release never cut, and not one green gate could see it, because none of them looks outward.
  #
  # So this job asks the two services THEMSELVES, unauthenticated, exactly as a reader would: is the version on the
  # registry, is it `latest`, does the tarball actually serve, do its bytes hash to the digest npm signed, is the
  # provenance bundle retrievable, is there a Zenodo record for THIS version, does it carry a file, and does
  # doi.org resolve it to Zenodo. src/release-live.ts computes the verdict; src/release-live.test.ts drives all
  # eleven checks to failure on fixtures, so the battery is known to be capable of failing.
  #
  # IT RETRIES, AND THE REASON IS NOT FLAKINESS. DataCite registration lags the Zenodo deposit by minutes, so a
  # record can exist while its DOI resolves nowhere — the honest reading of that is "not yet", not "broken". The
  # loop waits for it rather than failing a correct release, and still fails if it never lands. UNREAD IS NOT LIVE:
  # release-live exits 2 when a service did not answer at all, which is a held verdict and not a pass, so the loop
  # treats it as not-yet-live too and the job fails if the network never answers.
  verify:
    runs-on: ubuntu-latest
    needs: [publish, extension]   # the GitHub Release is what Zenodo mints from
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - name: Install deps
        run: npm ci --no-audit --no-fund
      - name: npm and Zenodo must both carry THIS release, complete and resolvable
        run: |
          set -uo pipefail
          npm run build --silent
          V="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 12); do
            node dist/scripts/release-live.js "$V" && exit 0
            code=$?
            echo "::notice::attempt $i — release-live exit $code (1=refuted, 2=unread); DataCite registration lags the deposit, waiting 30s"
            sleep 30
          done
          echo "::error::the release is not live after 6 minutes — npm and/or Zenodo do not carry $V completely. See the check list above; lean/release-live.json holds the verdict."
          exit 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-live
          path: lean/release-live.json
          retention-days: 7

  # WORKFLOW-ONLY — same deposit gate; never curl from a laptop.
  zenodo-seals:
    runs-on: ubuntu-latest
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }   # a wing reads a committed definition from history (lean-involutions, 7a54411e)
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Gate — Zenodo seals deposit is workflow-only
        # the dispatcher owns the name (`npm run x -- zenodo-deposit`); this step calls the built file directly
        # because the build already ran above, and package.json keeps no wrapper entry for it to lag behind.
        run: node dist/scripts/zenodo-deposit.js
      - name: Version every depositable publication seal (manifest loop)
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$ZENODO_TOKEN" || { echo "::error::ZENODO_ACCESS_TOKEN secret is empty"; exit 1; }
          test -f zenodo/manifest.json || { echo "::error::zenodo/manifest.json missing — run gen-zenodo-seals"; exit 1; }
          AUTH="Authorization: Bearer $ZENODO_TOKEN"
          COUNT=$(jq -r '.count' zenodo/manifest.json)
          echo "zenodo-seals — $COUNT depositable seal(s), license $(jq -r '.license' zenodo/manifest.json)"
          jq -c '.seals[]' zenodo/manifest.json | while read -r SEAL; do
            ID=$(echo "$SEAL" | jq -r '.id')
            CONCEPT_RECORD=$(echo "$SEAL" | jq -r '.standingRecordId')
            CONCEPT_CHAIN=$(echo "$SEAL" | jq -r '.conceptId')
            META=$(echo "$SEAL" | jq -r '.metaFile')
            LICENSE=$(echo "$SEAL" | jq -r '.license')
            echo "::group::seal $ID → record $CONCEPT_RECORD / concept $CONCEPT_CHAIN"
            test -f "$META" || { echo "::error::$META missing"; exit 1; }
            test "$LICENSE" = "cc-by-nc-nd-4.0" || { echo "::error::seal $ID license '$LICENSE' ≠ cc-by-nc-nd-4.0"; exit 1; }
            jq -e '.title | type == "string" and length > 0' "$META" > /dev/null
            jq -e '.description | type == "string" and length >= 80' "$META" > /dev/null
            jq -e '.creators | type == "array" and length > 0' "$META" > /dev/null
            jq -e '.keywords | type == "array" and length >= 3' "$META" > /dev/null
            jq -e '.license == "cc-by-nc-nd-4.0"' "$META" > /dev/null || { echo "::error::$META license drift"; exit 1; }
            jq -e '.language | type == "string"' "$META" > /dev/null
            jq -e '.publication_date | type == "string"' "$META" > /dev/null
            jq -e '(.related_identifiers // []) | length >= 2' "$META" > /dev/null
            jq -e '(.keywords // []) | map(select(startswith("related:"))) | length >= 1' "$META" > /dev/null \
              || { echo "::error::$ID missing related:* keywords"; exit 1; }
            jq -e '.notes | type == "string" and length > 20' "$META" > /dev/null \
              || { echo "::error::$ID missing notes (prior-art claim/credit)"; exit 1; }
            jq -e '(.communities // []) | length >= 1' "$META" > /dev/null
            jq -e '(.references // []) | type == "array"' "$META" > /dev/null
            jq -e '(.contributors // []) | length >= 1' "$META" > /dev/null
            jq -e '(.related_identifiers // []) | any(.relation == "isAlternateIdentifier")' "$META" > /dev/null \
              || { echo "::error::$ID missing handle alternate identifier"; exit 1; }
            BUNDLE="seal-$ID-$GITHUB_REF_NAME.tar.gz"
            mapfile -t PATHS < <(echo "$SEAL" | jq -r '.bundlePaths[]')
            tar -czf "$BUNDLE" "$META" "${PATHS[@]}"
            shasum -a 256 "$BUNDLE"
            DRAFT=$(curl -sf -X POST -H "$AUTH" "https://zenodo.org/api/deposit/depositions/$CONCEPT_RECORD/actions/newversion" | jq -r '.links.latest_draft // empty' || true)
            test -n "$DRAFT" || { echo "::error::cannot version $CONCEPT_RECORD for $ID — refusing fresh deposition"; exit 1; }
            DEP=$(curl -sf -H "$AUTH" "$DRAFT")
            for FID in $(echo "$DEP" | jq -r '.files[]?.id'); do
              curl -sf -X DELETE -H "$AUTH" "$(echo "$DEP" | jq -r '.links.self')/files/$FID" || true
            done
            SELF=$(echo "$DEP" | jq -r '.links.self')
            BUCKET=$(echo "$DEP" | jq -r '.links.bucket')
            jq --arg v "${GITHUB_REF_NAME#v}" '{metadata: (. + {version: $v})}' "$META" > "/tmp/meta-$ID.json"
            curl -sf -X PUT -H "$AUTH" -H "Content-Type: application/json" -d @"/tmp/meta-$ID.json" "$SELF" > /dev/null
            curl -sf -H "$AUTH" --upload-file "$BUNDLE" "$BUCKET/$BUNDLE" > /dev/null
            CODE=$(curl -s -o "/tmp/pub-$ID.json" -w '%{http_code}' -X POST -H "$AUTH" "$SELF/actions/publish" || echo 000)
            PUB=$(cat "/tmp/pub-$ID.json")
            case "$CODE" in
              20*) ;;
              *)   sleep 15
                   PUB=$(curl -sf -H "$AUTH" "$SELF" || echo '{}')
                   test "$(echo "$PUB" | jq -r '.state // empty')" = "done" || {
                     echo "::error::publish $ID failed HTTP $CODE"; exit 1; } ;;
            esac
            DOI=$(echo "$PUB" | jq -r '.doi // .metadata.prereserve_doi.doi // "unknown"')
            CONCEPT=$(echo "$PUB" | jq -r '.conceptrecid // empty')
            test "$CONCEPT" = "$CONCEPT_CHAIN" || { echo "::error::$ID landed on concept $CONCEPT ≠ $CONCEPT_CHAIN"; exit 1; }
            echo "::notice::$ID published — DOI $DOI on concept $CONCEPT_CHAIN"
            echo "::endgroup::"
          done
