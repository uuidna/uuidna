name: publish

# Publish @uuidna/uuidna to npm when a single-digit version tag (vX.Y.Z) is pushed (or on manual dispatch).
# TOKEN-FREE via OIDC Trusted Publishing (set on npmjs.com → the package's Settings → Trusted Publisher: GitHub
# Actions, repo uuidna/uuidna, workflow publish.yml). No NPM_TOKEN secret — GitHub's OIDC id-token is exchanged for
# a short-lived publish credential, so no 2FA-bypassing token is stored anywhere. The COMPLETE audit runs first, as
# the package's own prepublishOnly gate — a failing audit fails the publish, never production. Integrity, not truth.
#
# The audit is SEVEN recomputable dimensions (echoing the ℤ/7 rosette — the honest reading of "3×7 / 777": three
# sevens, 3×7 = 21, a mnemonic, NOT 777 of anything), each of which can FAIL the deploy:
#   1. build            — tsc type integrity
#   2. lean             — every theorem re-proven `by decide`, sorry-free (Lean 4.33.0, pinned by lean-toolchain)
#   3. provenance       — the honesty gate: every prose claim linked/demarcated (claims:0), or fail
#   4. tests            — crypt-guard · KAT · pq · quantum · smoke (incl. the no-Math purity check) · stream
#   5. determinism      — regenerating the ledger from the proofs leaves the tree clean (git diff --exit-code)
#   6. version guards   — tag == package.json version, and the single-digit odometer (each of MAJOR.MINOR.PATCH 0..9)
#   7. npm provenance   — the published tarball carries a signed Sigstore attestation (--provenance, id-token)
# Dimensions 1–5 are `npm run audit` (also the local prepublishOnly gate); 6–7 are added here for the deploy.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # dual use: OIDC trusted-publishing auth (token-free) + the Sigstore provenance attestation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # OIDC Trusted Publishing needs npm >= 11.5.1; Node 22 ships ~10.9, so upgrade the CLI before publishing.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Install Lean (elan, toolchain pinned by lean-toolchain)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Warm the pinned toolchain
        run: lean --version # reads lean-toolchain, installs v4.33.0 so `npm run lean` can verify

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Guard — tag matches package.json version, single-digit odometer
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          test "$TAG" = "$PKG" || { echo "::error::tag v$TAG != package.json $PKG"; exit 1; }
          # Harmonised with millennium-solutions: MAJOR.MINOR.PATCH are single digits (0..9), the vortex odometer.
          echo "$TAG" | grep -Eq '^[0-9]\.[0-9]\.[0-9]$' || { echo "::error::v$TAG breaks the single-digit odometer (each of major.minor.patch must be 0..9)"; exit 1; }

      # Token-free: OIDC (id-token: write above) is exchanged for the publish credential; no NODE_AUTH_TOKEN.
      - name: Publish (public, token-free via OIDC, with provenance) — prepublishOnly runs the complete audit first
        run: npm publish --provenance --access public

  # The desktop extension ships itself: pack extension/ (one manifest — the standards-compression) into
  # uuidna.mcpb and attach it to the release, so every tag carries the one-click carrier of the receipted tools.
  extension:
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pack the desktop extension
        run: |
          npx -y @anthropic-ai/mcpb pack extension/
          mv extension.mcpb uuidna.mcpb
          shasum -a 256 uuidna.mcpb
      - name: Attach to the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" uuidna.mcpb --clobber

