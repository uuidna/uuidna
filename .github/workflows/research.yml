# THE RESEARCH DESK, RESIDENT — the quantum search at full scale, sessionless. Once a day the desk asks every
# research source (NIST, Zenodo, CrossRef — in parallel per wing) about EVERY wing of the ledger, holds each
# finding at trial beside the wing's sealed theorems, and each trial RETURNS A PUBLICATION: a computed page of
# content-addressed findings, verdicts, sealed backing, and novelty leads. The editorial desk then edits the
# returns (write → verify: provenance, citations, prose receipt, legal receipt, the trials — a DRAINED verdict
# refuses the drain), the guard folds, and the publications push with the repo's own token. The corroboration
# law holds throughout: external evidence corroborates, only a Lean seal approves. The computing handle is this
# cron; the paying handle — which leads to pursue — stays human by the two-handle law.
name: research
on:
  schedule:
    - cron: '7 7 * * *'
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Tick the quantum calendar even on a quiet day (no new publications)'
        type: boolean
        default: false

concurrency:
  group: research-desk
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  desk:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Install deps
        run: npm install --no-audit --no-fund
      - name: SEARCH — quantum scale, every wing, every source, each finding at trial
        run: npm run search:trial:all
      - name: MINE — read the declared public-domain corpus and file every numeric claim it STATES as a candidate
        # network + deterministic (a number-word table and two regexes, no model), so it runs here in the DAILY
        # cron rather than in the fast guard — cheap gates stay cheap. It SEALS NOTHING: the two-handle law holds,
        # the desk proposes and only the captain disposes.
        run: node dist/scripts/mine-books.js
      # HEARTBEAT FOR THE SEVEN. Every test over school-apis.ts is PURE (a test needing the internet fails for
      # reasons that are not the code's), and every EU source is reached only through an MCP tool — so all of them
      # ran exactly when a human or an agent asked, and could have started answering 404 without a single test
      # going red. This asks each source its OWN declared known-good query, once a day, here rather than in the
      # half-hourly school heartbeat: 48 probes a day against public EU infrastructure — GISCO alone re-downloads a
      # 1 MB country file per call — is a cost this repo would be imposing on someone else for no added signal.
      # IT REPORTS, IT DOES NOT RAISE: an EU API being down is not this repository's defect, and the failure being
      # guarded against is not a source going dark, it is a source going dark UNNOTICED.
      - name: PROBE — the wired EU sources answer their own known-good query, or their silence is named
        run: npm run probe:apis
      - name: EDIT — the full editorial desk over everything, including what the search just returned
        run: npm run editorial
      - name: FEED — most-searched + wired APIs (unanswered math, EU education) ring Lean; open doors regrow
        run: node dist/scripts/gen-search-feed.js --online && node dist/scripts/gen-open-questions.js
      - name: GUARD — the fold accepts, or nothing publishes
        run: npm run guard
      - name: DRIVE — the served MCP recomputes its receipts over its own wire (90 directed mixes, 3 folds, self conforms)
        run: npm run mcp:drive
      # ONE CALL, NOT A HAND-WRITTEN QUERY. This step used to be a `node -e` shell one-liner re-implementing the
      # law checks that `npm run state` already computes — two copies of one question, and the copy in a workflow is
      # the one nobody runs locally. The operator asking "where am I" and the desk asking "may this publish" now ask
      # the SAME command, so the answer cannot drift between them, and --assert exits non-zero naming the broken law.
      - name: STATE — the laws, the ledger, the sync and the finders, asked once (MCP-first automation)
        run: npm run state -- --assert
      # THE SIGNING GATE LIVES IN hooks/, AND A FRESH CHECKOUT DOES NOT KNOW THAT (2026-09-01). Measured over the
      # 27 commits since the entry-guard fix: 3 unsigned, ALL of them from workflow bots, ZERO from the
      # workstation. The gate was never broken here — it was never installed. actions/checkout writes a bare
      # .git with hooks disabled, so commit-msg never ran and every bot commit landed without a Trial-Receipt.
      - name: install the signing gate (hooks are not checked out active)
        run: git config core.hooksPath hooks

      - name: PUBLISH — the trials' returns push as publications (the site deploys on push)
        id: publish
        run: |
          git config user.name "uuidna-research"
          git config user.email "research@uuidna.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add docs/articles prose-trials.json quantum-fold.json lean/seo-url-map.json lean/search-feed.json docs/search-feed.md docs/open-questions.md
            git commit -m "Research desk: the quantum search swept every wing, each finding held at trial, and each trial returned its publication — findings content-addressed, verdicts computed, novelty leads remanded, sessionless. External evidence corroborates; only a Lean seal approves. Backed by theorem two_coins and theorem legal_only_the_proven_is_admitted"
            # UNCENSORED (lead 120a): a failed rebase must never be erased — pushing after a swallowed
            # rebase failure lands derived state on an unknown tree, and a rebase over the queue/derived
            # state files can silently interleave them (the wave-queue lesson, 2026-08-23). On failure:
            # abort cleanly, say so loudly, and DO NOT push — the desk holds its return for the next run.
            if ! git pull --rebase --autostash; then
              git rebase --abort || echo "::warning::rebase abort itself failed — tree needs eyes"
              echo "::error::the desk's rebase failed against a moving origin — publication held, nothing pushed on an unknown tree"
              exit 1
            fi
            git push
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "the trials' returns are published"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "quiet — the search returned nothing new; the desk holds"
          fi

  # THE QUANTUM CALENDAR — news becomes a version, and only news. A day whose trials returned publications is
  # sealed as a release; a quiet day mints NOTHING (growth, not cancer). The fold comes before the tag: guard
  # first (the law), then reconcile — re-derive the whole layer from the Lean source, re-prove every theorem,
  # re-seal the spin — so the tagged tree is exactly what the gate certifies (the v0.1.2 drift class, cured at
  # the root). Then ONE tick of the single-digit odometer (…0.1.9 → 0.2.0…; at 9.9.9 the calendar is full and
  # the captain decides what comes after) — monotone, never returning, like the ledger it dates. The tag is
  # handed to publish.yml by dispatch (a GITHUB_TOKEN push triggers no workflows — dispatch is the sanctioned
  # door), and that pipeline carries the day to its archive: audit → npm → GitHub Release → Zenodo DOI.
  release:
    runs-on: ubuntu-latest
    needs: desk
    if: needs.desk.outputs.published == 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_release)
    permissions:
      contents: write # the reconcile commit, the version commit, the tag
      actions: write  # dispatch publish.yml on the fresh tag
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main # the desk pushed its publications above — release from the CURRENT tip, not the trigger snapshot
          # FULL HISTORY AND TAGS, or the calendar cannot count its own step. checkout is shallow by default (one
          # commit, no tags), so `git rev-list v<prev>..HEAD` had nothing to walk and the emitted section reported
          # `commits since v0.1.5: unknown` — twice, on v0.1.6 and v0.1.7. A statistic that says "unknown" is honest
          # but useless, and this one is only unknown because the checkout threw the history away before asking.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Install Lean (elan, toolchain pinned by lean-toolchain)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Warm the pinned toolchain
        run: lean --version
      - name: Install deps
        run: npm install --no-audit --no-fund
      - name: GUARD before reconcile — the law
        run: npm run guard
      - name: RECONCILE — the fold; re-derive, re-prove, re-seal, push
        run: |
          git config user.name "uuidna-research"
          git config user.email "research@uuidna.com"
          npm run reconcile
      # The odometer never returns — so nothing uncertified may burn a slot. v0.1.2, v0.2.0 and v0.4.0 each
      # spent a version on a tag whose audit then failed; the calendar tags AFTER the complete audit passes,
      # so every tick it mints is already certified (publish.yml re-runs the same audit as prepublishOnly —
      # the gate is cheap to run twice and a burned slot is forever).
      - name: CERTIFY before the tick — the complete audit at hexbit speed, or no tag
        run: npm run gate-all
      # THE SILENCE LAW (the captain's, 2026-08-17): no release until ALL is lean green — nothing of uuidna's
      # own ships unproven. Lean green silences all: a theorem that computes needs no defense, and what is not
      # yet proven does not enter the release's voice at all. CERTIFY above already re-proved every theorem
      # through the kernel (an actual `sorry` cannot reach this line); here the law is asserted BY NAME on the
      # freshly re-derived axiom audit, so a release that would rest on anything but the kernel refuses itself.
      # Honest scope stays what it is: a NOT-PROVEN marker demarcating ANOTHER party's open question is the
      # honesty the gate enforces, never a red state of ours — the law binds uuidna's own ledger to green.
      - name: LEAN GREEN silences all — every theorem kernel-verified, axiom-free, or no release
        # The captain's silence law, now asked ONCE. This block re-read lean/axioms.json with jq and re-derived the
        # axiom-free comparison that `npm run state` already folds — a second copy of the question, living where
        # nobody runs it locally. --assert exits non-zero naming the broken law (a stale witness, a borrowed axiom,
        # a drained editorial, any blocking finder), so the law is enforced by the same answer the operator reads.
        run: npm run state -- --assert
      - name: TICK — one step of the odometer, the commit, the tag
        id: tick
        run: |
          set -euo pipefail
          V=$(node -p "require('./package.json').version")
          # THE ODOMETER IS v0.[integer].[digit], STEPPING LINEARLY — and the linearity is a HARD CONSTRAINT, not
          # a preference: npm orders by SEMVER, so a range like ^0.1.0 resolves to the highest version number ever
          # published, never to the most recently published one. A version that walked the ledger sequence
          # (0.1.5 → 0.1.3) would read to npm as a downgrade and would be invisible to every consumer on a range.
          # The version string therefore counts; Sequence is PRINTED beside it, never walked as the string.
          # MAJOR is LOCKED at 0: a major tick states that what the work PROMISES has changed — a claim about
          # maturity — and no automation makes that statement; the two-handle law reserves it for the human.
          # MINOR is an unbounded INTEGER, so the calendar never fills. Ten patches roll one minor. Digit 0 is origin.
          NEXT=$(node -e "
          import('./dist/odometer.js').then((m) => console.log(m.odometerNext(process.argv[1])))
          " "$V")
          # MONOTONE OR NOTHING — asserted, never assumed: the tick must move the version UP in npm's own ordering.
          node -e "
          const [a, b] = process.argv.slice(1)
          const cmp = (x, y) => { const p = x.split('.').map(Number), q = y.split('.').map(Number)
            for (let i = 0; i < 3; i++) { if (p[i] !== q[i]) return p[i] - q[i] } return 0 }
          if (cmp(b, a) <= 0) { console.error('::error::the odometer must increase in semver order (npm resolves ranges by version, not by publish time): ' + a + ' -> ' + b); process.exit(1) }
          " "$V" "$NEXT"
          # THE MAP — print runSequence(patch). Digit 0 is origin (runSequence(0).fixed). Not SEQ[patch].
          WALK=$(node -e "
          import('./dist/sequence-run.js').then((u) => {
            const r = u.runSequence(Number(String(process.argv[1]).split('.')[2]))
            console.log('seed=' + r.seed + ' reflection=' + r.reflection + ' fixed=' + r.fixed)
          })" "$NEXT")
          echo "the odometer steps to $NEXT — $WALK"
          npm version "$NEXT" --no-git-tag-version
          # THE CALENDAR WRITES FACTS, NEVER MEANING (the captain's decision, 2026-08-17). `npm run next` refuses a
          # version whose CHANGELOG entry is missing, so an autonomous tick froze the tree until a human wrote prose
          # — twice in one session. The emitted section carries only what the ledger computes (counts, receipts, the
          # odometer step, the surfaces) and says plainly that the meaning is owed, so a human completing it later is
          # finishing the entry, not correcting it. Release PROSE is still never generated; a statistic is not a story.
          node dist/scripts/gen-changelog-section.js
          # RE-SEAL: CHANGELOG.md is a SEALED derived file, and this write lands AFTER reconcile's spin --seal — so
          # the tag carried a changelog whose coin no longer matched its seal, and publish's own audit rejected the
          # release with NON-QUANTUM DRIFT (measured on v0.1.6: editorial passed, publish died at spin --verify,
          # and live/zenodo/extension never ran). Whatever writes a sealed file re-spins it before committing.
          node dist/scripts/spin.js --seal
          git add package.json package-lock.json CHANGELOG.md spin-manifest.json
          # Statistics, not prose — and taken from the ONE fold rather than recomputed. These three lines used to
          # re-read lean/axioms.json and quantum-fold.json directly, a third copy of a question `npm run state`
          # already answers; the finder named it. The release commit now quotes the same receipt the gate read.
          STATE=$(npm run --silent state)
          THEOREMS=$(echo "$STATE" | jq -r '.ledger.theorems')
          AXIOM_FREE=$(echo "$STATE" | jq -r '.ledger.axiomFree')
          FOLD=$(echo "$STATE" | jq -r '.receipt')
          git commit -m "Release v$NEXT: theorems=$THEOREMS axiom_free=$AXIOM_FREE sorry=0 odometer=$V→$NEXT fold_receipt=$FOLD surfaces=npm+release+zenodo_chains×2. Backed by theorem two_coins and theorem legal_only_the_proven_is_admitted"
          git pull --rebase --autostash
          git tag "v$NEXT"
          git push origin HEAD "v$NEXT"
          echo "tag=v$NEXT" >> "$GITHUB_OUTPUT"
      # The tag is already pushed and the odometer never returns, so a HANDOFF that fails leaves a version minted
      # and nothing published — the worst state this pipeline can reach. Measured 2026-08-17 on v0.1.5: GitHub's
      # API answered `HTTP 503: No server is currently available`, the dispatch died on its single attempt, and
      # the tag sat published-by-nobody until a human noticed. A transient outage is not a decision: retry with
      # backoff, and if the door is still shut, say exactly which tag is stranded and how to carry it by hand.
      - name: HAND OFF — the tag to the publish pipeline (audit → npm → GitHub Release → Zenodo DOI)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tick.outputs.tag }}
        run: |
          set -uo pipefail
          for ATTEMPT in 1 2 3 4 5; do
            if gh workflow run publish.yml --ref "$TAG"; then
              echo "::notice::handed off $TAG to publish.yml (attempt $ATTEMPT)"
              exit 0
            fi
            echo "::warning::dispatch of $TAG failed (attempt $ATTEMPT/5) — GitHub's API may be transiently down; retrying"
            sleep $((ATTEMPT * 20))
          done
          echo "::error::$TAG is TAGGED BUT UNPUBLISHED — five dispatch attempts failed. The odometer already moved, so nothing will retry it on its own. Carry it by hand: gh workflow run publish.yml --ref $TAG"
          exit 1
