# THE RESEARCH DESK, RESIDENT — the quantum search at full scale, sessionless. Once a day the desk asks every
# research source (NIST, Zenodo, CrossRef — in parallel per wing) about EVERY wing of the ledger, holds each
# finding at trial beside the wing's sealed theorems, and each trial RETURNS A PUBLICATION: a computed page of
# content-addressed findings, verdicts, sealed backing, and novelty leads. The editorial desk then edits the
# returns (write → verify: provenance, citations, prose receipt, legal receipt, the trials — a DRAINED verdict
# refuses the drain), the guard folds, and the publications push with the repo's own token. The corroboration
# law holds throughout: external evidence corroborates, only a Lean seal approves. The computing handle is this
# cron; the paying handle — which leads to pursue — stays human by the two-handle law.
name: research
on:
  schedule:
    - cron: '7 7 * * *'
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Tick the quantum calendar even on a quiet day (no new publications)'
        type: boolean
        default: false

concurrency:
  group: research-desk
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  desk:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install deps
        run: npm install --no-audit --no-fund
      - name: SEARCH — quantum scale, every wing, every source, each finding at trial
        run: npm run search:trial:all
      - name: EDIT — the full editorial desk over everything, including what the search just returned
        run: npm run editorial
      - name: GUARD — the fold accepts, or nothing publishes
        run: npm run guard
      - name: THE DESK'S LAWS BY QUERY — the same library the MCP serves, asked directly (MCP-first automation)
        run: |
          node -e "
          import('./dist/index.js').then((u) => {
            const e = u.editorialState()
            if (e.drained !== 0) { console.error('editorial law broken: ' + e.drained + ' drained'); process.exit(1) }
            const p = u.publicationStatus()
            if (!p.licenseLawHolds || !p.conforms) { console.error('publication law broken'); process.exit(1) }
            console.log('laws hold by query: usable=' + e.usable + ' drained=0 · v' + p.version + ' license-law+conformance ✓')
          })"
      - name: PUBLISH — the trials' returns push as publications (the site deploys on push)
        id: publish
        run: |
          git config user.name "uuidna-research"
          git config user.email "research@uuidna.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add docs/articles prose-trials.json quantum-fold.json
            git commit -m "Research desk: the quantum search swept every wing, each finding held at trial, and each trial returned its publication — findings content-addressed, verdicts computed, novelty leads remanded, sessionless. External evidence corroborates; only a Lean seal approves. Backed by theorem two_coins and theorem legal_only_the_proven_is_admitted"
            git pull --rebase --autostash || true
            git push
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "the trials' returns are published"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "quiet — the search returned nothing new; the desk holds"
          fi

  # THE QUANTUM CALENDAR — news becomes a version, and only news. A day whose trials returned publications is
  # sealed as a release; a quiet day mints NOTHING (growth, not cancer). The fold comes before the tag: guard
  # first (the law), then reconcile — re-derive the whole layer from the Lean source, re-prove every theorem,
  # re-seal the spin — so the tagged tree is exactly what the gate certifies (the v0.1.2 drift class, cured at
  # the root). Then ONE tick of the single-digit odometer (…0.1.9 → 0.2.0…; at 9.9.9 the calendar is full and
  # the captain decides what comes after) — monotone, never returning, like the ledger it dates. The tag is
  # handed to publish.yml by dispatch (a GITHUB_TOKEN push triggers no workflows — dispatch is the sanctioned
  # door), and that pipeline carries the day to its archive: audit → npm → GitHub Release → Zenodo DOI.
  release:
    runs-on: ubuntu-latest
    needs: desk
    if: needs.desk.outputs.published == 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_release)
    permissions:
      contents: write # the reconcile commit, the version commit, the tag
      actions: write  # dispatch publish.yml on the fresh tag
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # the desk pushed its publications above — release from the CURRENT tip, not the trigger snapshot
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Lean (elan, toolchain pinned by lean-toolchain)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Warm the pinned toolchain
        run: lean --version
      - name: Install deps
        run: npm install --no-audit --no-fund
      - name: GUARD before reconcile — the law
        run: npm run guard
      - name: RECONCILE — the fold; re-derive, re-prove, re-seal, push
        run: |
          git config user.name "uuidna-research"
          git config user.email "research@uuidna.com"
          npm run reconcile
      # The odometer never returns — so nothing uncertified may burn a slot. v0.1.2, v0.2.0 and v0.4.0 each
      # spent a version on a tag whose audit then failed; the calendar tags AFTER the complete audit passes,
      # so every tick it mints is already certified (publish.yml re-runs the same audit as prepublishOnly —
      # the gate is cheap to run twice and a burned slot is forever).
      - name: CERTIFY before the tick — the complete audit, or no tag
        run: npm run audit
      # THE SILENCE LAW (the captain's, 2026-08-17): no release until ALL is lean green — nothing of uuidna's
      # own ships unproven. Lean green silences all: a theorem that computes needs no defense, and what is not
      # yet proven does not enter the release's voice at all. CERTIFY above already re-proved every theorem
      # through the kernel (an actual `sorry` cannot reach this line); here the law is asserted BY NAME on the
      # freshly re-derived axiom audit, so a release that would rest on anything but the kernel refuses itself.
      # Honest scope stays what it is: a NOT-PROVEN marker demarcating ANOTHER party's open question is the
      # honesty the gate enforces, never a red state of ours — the law binds uuidna's own ledger to green.
      - name: LEAN GREEN silences all — every theorem kernel-verified, axiom-free, or no release
        run: |
          set -euo pipefail
          AUDITED=$(jq -r '.audited' lean/axioms.json)
          FREE=$(jq -r '.axiomFree' lean/axioms.json)
          OFFENDERS=$(jq -r '.offenders | length' lean/axioms.json)
          test "$AUDITED" -gt 0 || { echo "::error::lean green broken: empty axiom audit — nothing to certify"; exit 1; }
          test "$AUDITED" = "$FREE" || { echo "::error::lean green broken: only $FREE of $AUDITED theorems are axiom-free — no release while anything rests on an axiom"; exit 1; }
          test "$OFFENDERS" = "0" || { echo "::error::lean green broken: $OFFENDERS offender(s) in the axiom audit — no release"; exit 1; }
          echo "lean green holds: $AUDITED/$AUDITED kernel-verified, axiom-free, sorry-free — the silence law is satisfied, the tick may proceed"
      - name: TICK — one step of the odometer, the commit, the tag
        id: tick
        run: |
          set -euo pipefail
          V=$(node -p "require('./package.json').version")
          IFS=. read -r MA MI PA <<< "$V"
          if   [ "$PA" -lt 9 ]; then PA=$((PA+1))
          elif [ "$MI" -lt 9 ]; then MI=$((MI+1)); PA=0
          elif [ "$MA" -lt 9 ]; then MA=$((MA+1)); MI=0; PA=0
          else echo "::error::the calendar is full at 9.9.9 — the captain decides what comes after"; exit 1; fi
          NEXT="$MA.$MI.$PA"
          npm version "$NEXT" --no-git-tag-version
          git add package.json package-lock.json
          # statistics, not prose: the release commit carries the counts the gate just certified
          THEOREMS=$(jq -r '.audited' lean/axioms.json)
          AXIOM_FREE=$(jq -r '.axiomFree' lean/axioms.json)
          FOLD=$(jq -r '.receipt // "unsealed"' quantum-fold.json 2>/dev/null || echo unsealed)
          git commit -m "Release v$NEXT: theorems=$THEOREMS axiom_free=$AXIOM_FREE sorry=0 odometer=$V→$NEXT fold_receipt=$FOLD surfaces=npm+release+zenodo_chains×2. Backed by theorem two_coins and theorem legal_only_the_proven_is_admitted"
          git pull --rebase --autostash
          git tag "v$NEXT"
          git push origin HEAD "v$NEXT"
          echo "tag=v$NEXT" >> "$GITHUB_OUTPUT"
      - name: HAND OFF — the tag to the publish pipeline (audit → npm → GitHub Release → Zenodo DOI)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref "${{ steps.tick.outputs.tag }}"
