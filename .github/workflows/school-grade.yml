# THE KERNEL GRADER — the school's proof exercises, judged by the Lean kernel on GitHub's runners.
#
# TWO JOBS, SPLIT BY WHAT EACH MAY HOLD. Running `lean` on a learner's text runs that text: elaboration executes
# tactics. So the job that runs it holds nothing worth taking — contents: read, no id-token, no secret, checkout
# without persisted credentials, the elan cache restored but never saved (a saved cache would carry this job's
# writes into every workflow that restores the same key), and `lean` started with only PATH/HOME/ELAN_HOME/LANG.
# The job that holds the signing permission (id-token: write) runs no checkout and no learner text: it downloads
# the verdicts as data, checks the file parses as JSON, and posts it under an OIDC token whose audience is
# https://uuidna.com. The Worker (src/school/grade) verifies that token against this file on refs/heads/main and
# records a verdict only on a submission still queued.
#
# THE DOOR RUNS BEFORE THE KERNEL (src/school/grade/door/index.ts): the statement and theorem name come from the lesson in
# this checkout; the learner supplies only the proof block, and a block holding #eval, #exit, run_cmd, run_tac, IO,
# unsafe, @[extern], @[implemented_by], axiom, sorry, admit, native_decide, import or set_option, or one that could
# close the proof and start a command, is door-refused and never reaches `lean`. Each proof has a 60 s budget.
name: school-grade
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: school-grade
  cancel-in-progress: false

permissions: {}

jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      graded: ${{ steps.grade.outputs.graded }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Install deps
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: 'KERNEL CACHE — restore only'
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: 'KERNEL — install the judge (elan resolves the repo-pinned toolchain)'
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
          "$HOME/.elan/bin/elan" default "$(cat lean-toolchain)"
          "$HOME/.elan/bin/lean" --version
      - name: 'GRADE — door, then kernel, for each queued submission'
        id: grade
        env:
          SCHOOL_QUEUE: https://uuidna.com/school/submissions?status=queued
        run: |
          # EXIT 2 IS "NOT PROVISIONED", AND IT IS NOT A BUILD FAILURE.
          #
          # This job had gone red six times in a row, every time on `the queue answered 503`, and that 503 was
          # uuidna.com reporting that the SCHOOL KV namespace has never been bound — the state wrangler.toml
          # declares as intended until the owner runs `wrangler kv namespace create SCHOOL`. Reporting an owner
          # action pending in the same red as a broken grader is how a repository teaches people to stop reading
          # its CI, and it hid the only question this job exists to answer.
          #
          # So the grader's exit code decides: 0 graded, 1 BROKEN (still red, still a failure), 2 UNPROVISIONED —
          # surfaced as a warning and a job-summary line, and NOT green-washed: school-grade.js writes
          # lean/school-queue.json, src/api-leads.ts turns that into an OPEN LEAD, and leads-gate — the release
          # gate — holds the next release on it. The pending state now blocks something that matters instead of
          # flashing red somewhere nobody looks.
          set +e
          node dist/scripts/school-grade.js school-verdicts.json
          code=$?
          set -e
          if [ "$code" = "2" ]; then
            echo "::warning title=school queue unprovisioned::uuidna.com/school/submissions answers 503 (no SCHOOL KV namespace bound). Owner act: wrangler kv namespace create SCHOOL, then uncomment [[kv_namespaces]] SCHOOL in wrangler.toml. Recorded as an open lead — leads-gate holds the next release on it."
            {
              echo "### school-grade — UNPROVISIONED"
              echo ""
              echo "The public queue answered \`503 storage unavailable (no SCHOOL KV namespace bound)\`."
              echo "Nothing was graded, so nothing is proven — this run is **not** a pass."
              echo ""
              echo "**Owner act:** \`wrangler kv namespace create SCHOOL\`, then uncomment the \`[[kv_namespaces]]\` SCHOOL block in \`wrangler.toml\`."
              echo ""
              echo "Held as an open lead in \`lean/school-queue.json\`; \`leads-gate\` blocks the next release while it stands."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "graded=0" >> "$GITHUB_OUTPUT"
            echo "state=unprovisioned" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$code" != "0" ]; then exit "$code"; fi
          echo "graded=$(jq '.verdicts | length' school-verdicts.json)" >> "$GITHUB_OUTPUT"
          echo "state=graded" >> "$GITHUB_OUTPUT"
      # nothing to upload when the store was never provisioned — the grader wrote no verdicts file
      - uses: actions/upload-artifact@v7
        if: steps.grade.outputs.state == 'graded'
        with:
          name: school-verdicts
          path: school-verdicts.json
          retention-days: 1
          if-no-files-found: error

  post:
    needs: kernel
    if: needs.kernel.outputs.graded != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: school-verdicts
      - name: 'POST — the verdicts, signed by this workflow''s OIDC token'
        run: |
          set -euo pipefail
          jq -e '.verdicts | type == "array"' school-verdicts.json > /dev/null
          TOKEN="$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https%3A%2F%2Fuuidna.com" | jq -r '.value')"
          echo "::add-mask::$TOKEN"
          curl -sSf -X POST https://uuidna.com/school/grade \
            -H "Authorization: Bearer $TOKEN" \
            -H 'content-type: application/json' \
            --data-binary @school-verdicts.json
