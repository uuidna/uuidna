name: deploy

# Deploy uuidna.com — the Workers Assets static site AND the edge worker (worker.js), which carries the hosted MCP at
# /mcp — ONLY through GitHub Actions, on a RELEASE TAG, and ONLY after the tree re-proves clean.
#
# WHY THE TAG AND NOT main (changed 2026-08-19): the site used to deploy on every push to main, so production
# tracked the newest commit rather than the released one. v0.2.3 exposed the gap — the deploy fired at 18:24 from
# the release COMMIT while the tag went at 18:27, so the site was correct by content and not because the release
# drove it. Now the tag is the single event that moves npm, Zenodo, the GitHub Release and the site together, and
# uuidna.com states a version that a consumer can actually install.
#
# THAT COST WAS PAID AND THE TRADE WAS REVISED (2026-08-31, the captain's call). Tag-only meant work merged to
# main did not reach production until the next cut, and with the wrangler step gone as well the two absences
# compounded: no tag was cut for a day, so nothing shipped at all, and 27 landings sat behind a green CI while
# the worker went 25 hours stale. The trade only held while someone cut tags often; nothing enforced that, and
# nothing reported when it stopped. main now ships on every landing AND a tag still ships, so a release reaches
# production on its own rather than depending on a habit.
#
# WHAT THIS COSTS INSTEAD, stated as plainly: every landing is a production deploy, so main must stay releasable
# — which is what the pre-push court and the proofs below already require. The concurrency group is keyed on the
# ref with cancel-in-progress, so a burst of landings collapses to the newest rather than queueing a deploy per
# commit. workflow_dispatch is kept for a deliberate out-of-band ship.
#
# ORDERING WITH publish.yml: both fire on the same tag. publish's `live` job verifies uuidna.com and waits on
# `publish`, whose prepublishOnly audit runs ~8 minutes, while this deploy takes ~2 — so the site is already
# updated when `live` checks it. That margin is comfortable but INCIDENTAL, not enforced; if the audit ever gets
# fast or this deploy slow, `live` could verify the previous site and pass for the wrong reason.
#
# THE PROOF IS ALREADY DONE AT PUSH TIME. Every theorem is re-proven `by decide`, sorry-free, by `npm run lean` in the
# reconcile gate BEFORE a commit reaches main — and its credit is settled there: each proven theorem is CLAIMED BY THE
# CAPTAIN unless a proving link attributes it to a PRIOR SOURCE, in which case it is CREDITED to that source (the credit
# law — "the captain claims the unclaimed; whoever claimed first is credited"). So this deploy does NOT re-run Lean; it
# TRUSTS the push-time proof and re-verifies the fast, decisive checks on the already-proven, already-credited tree:
#   • build   — tsc type integrity, on a clean runner: the one check no receipt can stand in for
#   • receipt — gate-receipt.json content-addresses src/ and lean/, the exact inputs `npm test` and `npm run guard`
#               read. The tag's commit already passed both in the pre-push gate, so re-running them here was the
#               same computation over byte-identical inputs — the recompute theorem
#               verify_beats_recompute_by_magnitudes exists to replace. VERIFY, don't recompute.
#   • tests + guard — run IN FULL, automatically, whenever the receipt does not cover this tree. The fast path is
#               taken only when the proof provably applies; a tree that moved by one byte takes the slow one.
# A failing check FAILS the deploy — never production on a tree that no longer verifies. Integrity, not truth.
#
# THIS WORKFLOW DEPLOYS AGAIN, and the claim that it needn't was folklore that went unchecked for a year.
# 228a63b3 deleted the wrangler step saying "Cloudflare's Git integration ships on every push". The instrument
# disagrees: `wrangler deployments list` reports Source: Unknown (deployment) for EVERY release — direct uploads
# from a workstation, never a git trigger. On the day this was written, 27 commits landed on main and produced no
# deployment at all, leaving the worker 25 hours behind a fully green CI. There was no second path; there was no
# path. The site went stale in silence because the only thing watching was a comment.
#
# SECRETS, held by an operator and never by this file (repo → Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN    — a Workers-scoped API token
#   CLOUDFLARE_ACCOUNT_ID   — the account the worker lives in
# Missing either one FAILS the run. It does not skip: a step that quietly does nothing when unconfigured cannot be
# told apart from one that worked, and that confusion is the entire defect this file is correcting.
#
# `npm run ship` (deploy-run.ts) remains the workstation path and still works; wrangler.toml's [build] runs the
# docs build on either route, so both ship the same artefact. If BOTH are used, they are two writers to one
# worker — cut releases from one of them, not from whichever is nearest to hand.

on:
  push:
    branches: [main]      # every landing ships — the tag-only trigger is why 27 commits deployed nothing
    tags: ['v*']          # and a release tag still ships, so a cut version reaches production on its own
  workflow_dispatch:     # deliberate out-of-band deploy (a docs fix that should not wait for a release)

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

# THE TOKEN CAN ONLY READ. Without this block the GITHUB_TOKEN handed to every job carries the repository default,
# which for a workflow that runs on a tag push is far more than this job uses: it checks out, builds, and deploys to
# Cloudflare with CLOUDFLARE_API_TOKEN — a secret of its own. Nothing here calls the GitHub API, so a compromised
# dependency in `npm install` gets a token that cannot write to the repository (actions/missing-workflow-permissions).
# Declared at workflow level so a job added later inherits the floor instead of silently starting from the default.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Install deps
        run: npm install --no-audit --no-fund

      # BUILD STAYS: tsc on a clean ubuntu runner is the one check a receipt cannot stand in for — it proves THIS
      # environment can compile the tree, not merely that some machine once did.
      - name: PROVE — build (types) on a clean runner
        run: npm run build

      # VERIFY, DO NOT RECOMPUTE (theorem verify_beats_recompute_by_magnitudes). The tag's commit already passed
      # `npm test` and `npm run guard` in the pre-push gate, and gate-receipt.json content-addresses src/ and lean/
      # — the exact inputs those checks read. If the tag's tree matches, re-running them is the same computation
      # over byte-identical inputs; if it does NOT match, the receipt does not apply and the next step runs them in
      # full. The fast path is taken only when the proof provably covers this tree.
      - name: PROVE — the push-time proof covers this exact tree
        id: receipt
        continue-on-error: true
        run: node dist/scripts/gate-receipt.js --verify

      - name: PROVE — tests + guard (only when the receipt does not cover this tree)
        if: steps.receipt.outcome == 'failure'
        run: npm test && npm run guard

      # THE DEPLOY ITSELF — restored. 228a63b3 removed it on the grounds that "Cloudflare's Git integration ships
      # on every push", and that was never true: `wrangler deployments list` reports Source: Unknown (deployment)
      # for every release — direct uploads from a workstation, never a git trigger — and on the day this was
      # written 27 commits landed on main and produced ZERO deployments, leaving the worker 25 hours behind a
      # fully green CI. A folklore claim justified deleting the only automated path, and nothing ever reported it.
      #
      # It runs only after the proofs above, so production never follows a tree that stopped verifying, and it
      # REFUSES rather than skips when unconfigured. That is the whole lesson of the outage this file is
      # correcting: a step that quietly does nothing when it is not set up is indistinguishable from a step that
      # worked, which is exactly how three HARD gates exited 0 for 229 commits without anyone noticing.
      - name: DEPLOY — worker and assets to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set, so this workflow cannot deploy."
            echo "An operator adds both at Settings -> Secrets and variables -> Actions, then re-runs this job."
            echo "Failing rather than skipping is deliberate: a green run that shipped nothing is worse than a red one."
            exit 1
          fi
          npx wrangler deploy

      # AND THE DEPLOY IS VERIFIED RATHER THAN ASSUMED — the same instrument that exposed the folklore.
      - name: PROVE — the deployment landed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deployments list | head -40
