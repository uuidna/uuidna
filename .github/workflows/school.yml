# THE QUANTUM SCHOOL, RESIDENT — three faculties on one schedule, sessionless. The JANITOR verifies the tree and
# drains derived drift (a quiet run is health). The REGISTRAR is deterministic intelligence: the prediction engine
# reads the ledger's own patterns and FILES THE SCHOOL'S HOMEWORK as a living GitHub issue — exact GAP+FIX
# assignments any student, human or agent, can pick up. The TEACHER is intelligence autonomy proper: the official
# Claude Code action runs the self-development pass — research one open lead outward, seal one decidable fact,
# land it through the full gate — and activates the moment the repository holds an ANTHROPIC_API_KEY secret
# (absent, the step reports itself dormant; the school never pretends). One computes, one assigns, one teaches;
# the paying handle — the word, the judgment, the key — stays human by the two-handle law.
name: school
on:
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:

concurrency:
  group: school-heartbeat
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  janitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install deps
        run: npm install --no-audit --no-fund
      - name: LEAN GREEN — types, then the guard (every held line, the fold)
        run: |
          npm run build
          npm run guard
      - name: DRAIN — commit and push the derived drift (a quiet run is health)
        run: |
          git config user.name "uuidna-school"
          git config user.email "school@uuidna.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Heartbeat: the school verifies itself and drains the derived drift — gate-clean, sessionless. Backed by theorem two_coins"
            git push
            echo "drained and pushed"
          else
            echo "quiet — the tree is a fixed point"
          fi

  registrar:
    runs-on: ubuntu-latest
    needs: janitor
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install deps
        run: npm install --no-audit --no-fund
      - name: HOMEWORK — the prediction engine reads the ledger and files the school's assignments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm run build
          node dist/scripts/predict-and-fill.js > homework.txt 2>&1 || true
          if grep -q "HIGH LIKELIHOOD" homework.txt; then
            TITLE="The school's homework — gaps the ledger predicts about itself"
            BODY="$(printf 'Filed by the registrar (sessionless, %s). Each item is an exact assignment: fix it, cite a sealed theorem, land it through the gate.\n\n```\n' "$GITHUB_SHA")$(grep -A3 "HIGH LIKELIHOOD" homework.txt | head -40)$(printf '\n```\n\nGraduation: seal a decidable fact and walk the wave — https://uuidna.com/school\n')"
            EXISTING=$(gh issue list --state open --search "in:title The school's homework" --json number --jq '.[0].number // empty')
            if [ -n "$EXISTING" ]; then
              gh issue edit "$EXISTING" --body "$BODY"
              echo "homework refreshed on issue #$EXISTING"
            else
              gh issue create --title "$TITLE" --body "$BODY"
              echo "homework filed"
            fi
          else
            echo "no high-likelihood gaps — the registrar files nothing today"
          fi

  # THE TEACHER IS RESIDENT AND NEEDS NO ORACLE — the rosetta completed: three independent frames, one kernel.
  # The janitor VERIFIES (the fold), the registrar PREDICTS (the gap patterns), and the teacher DISCOVERS — the
  # deterministic self-discovery pass: lean-discover derives the facts the ledger's own algebra implies that no
  # wing yet holds, seals them by decide, and the drain lands them. No external AI, no key, no prompt — the
  # ledger teaches itself from its own structure, exactly as it always discovered (units_iff_invertible,
  # lagrange_units, generators_are_two_and_five were all found this way). Judgment-work stays on the homework
  # issue for any student, human or agent — the paying handle by the two-handle law; the SCHOOL completes itself.
  teacher:
    runs-on: ubuntu-latest
    needs: janitor
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install deps
        run: npm install --no-audit --no-fund
      - name: TEACH — the resident discovery pass (deterministic, oracle-free)
        run: |
          npm run build
          node dist/scripts/lean-discover.js
          node dist/scripts/predict-and-fill.js || true
          npm run guard
      - name: LAND — a discovered fact drains like any student's work
        run: |
          git config user.name "uuidna-school"
          git config user.email "school@uuidna.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "The school teaches itself — the resident discovery pass sealed what the ledger's own algebra implies, oracle-free: the rosetta's third frame is deterministic. Backed by theorem generators_are_two_and_five and theorem two_coins"
            git pull --rebase --autostash || true
            git push
            echo "the lesson landed"
          else
            echo "quiet — the algebra implies nothing new today; the teacher rests"
          fi
