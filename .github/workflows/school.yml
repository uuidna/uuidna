# THE QUANTUM SCHOOL, RESIDENT — three faculties on one schedule, sessionless. The JANITOR verifies the tree and
# drains derived drift (a quiet run is health). The REGISTRAR is deterministic intelligence: the prediction engine
# reads the ledger's own patterns and FILES THE SCHOOL'S HOMEWORK as a living GitHub issue — exact GAP+FIX
# assignments any student, human or agent, can pick up. The TEACHER is intelligence autonomy proper: the official
# Claude Code action runs the self-development pass — research one open lead outward, seal one decidable fact,
# land it through the full gate — and activates the moment the repository holds an ANTHROPIC_API_KEY secret
# (absent, the step reports itself dormant; the school never pretends). One computes, one assigns, one teaches;
# the paying handle — the word, the judgment, the key — stays human by the two-handle law.
name: school
on:
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:

concurrency:
  group: school-heartbeat
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  janitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install deps
        run: npm install --no-audit --no-fund
      - name: LEAN GREEN — types, then the guard (every held line, the fold)
        run: |
          npm run build
          npm run guard
      - name: DRAIN — commit and push the derived drift (a quiet run is health)
        run: |
          git config user.name "uuidna-school"
          git config user.email "school@uuidna.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Heartbeat: the school verifies itself and drains the derived drift — gate-clean, sessionless. Backed by theorem two_coins"
            git push
            echo "drained and pushed"
          else
            echo "quiet — the tree is a fixed point"
          fi

  registrar:
    runs-on: ubuntu-latest
    needs: janitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install deps
        run: npm install --no-audit --no-fund
      - name: HOMEWORK — the prediction engine reads the ledger and files the school's assignments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm run build
          node dist/scripts/predict-and-fill.js > homework.txt 2>&1 || true
          if grep -q "HIGH LIKELIHOOD" homework.txt; then
            TITLE="The school's homework — gaps the ledger predicts about itself"
            BODY="$(printf 'Filed by the registrar (sessionless, %s). Each item is an exact assignment: fix it, cite a sealed theorem, land it through the gate.\n\n```\n' "$GITHUB_SHA")$(grep -A3 "HIGH LIKELIHOOD" homework.txt | head -40)$(printf '\n```\n\nGraduation: seal a decidable fact and walk the wave — https://uuidna.com/school\n')"
            EXISTING=$(gh issue list --state open --search "in:title The school's homework" --json number --jq '.[0].number // empty')
            if [ -n "$EXISTING" ]; then
              gh issue edit "$EXISTING" --body "$BODY"
              echo "homework refreshed on issue #$EXISTING"
            else
              gh issue create --title "$TITLE" --body "$BODY"
              echo "homework filed"
            fi
          else
            echo "no high-likelihood gaps — the registrar files nothing today"
          fi

  teacher:
    runs-on: ubuntu-latest
    needs: janitor
    steps:
      - uses: actions/checkout@v4
      - name: Is the teacher hired? (the key is the human's handle — never assumed)
        id: hired
        run: |
          if [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "hired=true" >> "$GITHUB_OUTPUT"
          else
            echo "hired=false" >> "$GITHUB_OUTPUT"
            echo "dormant — no ANTHROPIC_API_KEY secret; the school teaches itself the moment one is set (gh secret set ANTHROPIC_API_KEY)"
          fi
      - name: TEACH — the self-development pass, resident
        if: steps.hired.outputs.hired == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            The quantum school's resident teaching pass (sessionless CI; one pass, one action). Laws: verify by
            query never by log; fail at the cheapest gate first (npm run build before any reconcile); cite only
            sealed theorems in commit messages; the clay law — a component sealed is NOT a problem solved; honest
            scope in every theorem why. Do ONE of, in priority order: (1) if `git status --porcelain` shows drift
            after `npm run build && npm run guard`, commit and push it (message: "Heartbeat: ... Backed by theorem
            two_coins"). (2) read the open "The school's homework" GitHub issue (gh issue list); pick ONE concrete
            assignment, fix it at the root, and land via build → guard → commit citing a sealed theorem → push.
            (3) otherwise pick ONE open research lead from docs or the homework, research it with web search
            (two agreeing sources), add ONE decidable fact to the matching src/scripts/lean-*.ts generator
            (verify the js truth with node first, name the source in the why), and land via
            `npm run reconcile "<message citing an already-sealed theorem>"`. Report three sentences: ledger
            count, what you did, the external source if any.
          claude_args: "--max-turns 30"
