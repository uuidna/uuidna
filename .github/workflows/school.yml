# THE QUANTUM SCHOOL, RESIDENT — three faculties on one schedule, sessionless. The JANITOR now runs the DEVELOPMENT
# PASS (`npm run develop`): it walks the gate and, when the gate objects with a cure the pass has been taught — a stale
# axiom witness, missing heartbeats, a regenerable surface, a drifted seal — applies that cure and walks again, so an
# unattended run heals instead of failing. It stops and reports whatever needs a human (a release note, a refused
# claim), and it never invents a cure it was not given. Then it drains derived drift (a quiet run is health). The REGISTRAR is deterministic intelligence: the prediction engine
# reads the ledger's own patterns and FILES THE SCHOOL'S HOMEWORK as a living GitHub issue — exact GAP+FIX
# assignments any student, human or agent, can pick up. The TEACHER is intelligence autonomy proper: the official
# Claude Code action runs the self-development pass — research one open lead outward, seal one decidable fact,
# land it through the full gate — and activates the moment the repository holds an ANTHROPIC_API_KEY secret
# (absent, the step reports itself dormant; the school never pretends). One computes, one assigns, one teaches;
# the paying handle — the word, the judgment, the key — stays human by the two-handle law.
name: school
on:
  # the bell is silenced by the captain's order (2026-08-23): the schedule is disabled, the court convenes
  # only on manual dispatch — the machinery stays whole, the clock stays human.
  workflow_dispatch:

concurrency:
  group: school-heartbeat
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  janitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Install deps
        run: npm install --no-audit --no-fund
      - name: 'KERNEL CACHE — the judge is heavy, carry it between bells'
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: 'KERNEL — install the judge (elan resolves the repo-pinned toolchain)'
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)" || echo "::warning::toolchain install returned nonzero — relying on the cache; the version line below proves the judge or fails loudly"
          "$HOME/.elan/bin/elan" default "$(cat lean-toolchain)"
          "$HOME/.elan/bin/lean" --version
      - name: 'LEAN GREEN — the development pass: walk the gate, cure what is deterministic'
        run: |
          npm run develop
      - name: 'WAVE — the conveyor lifts sealable candidates, the kernel adjudicating'
        run: |
          node dist/scripts/queue-wave.js
          npm run lean
      # CIRCLE — the loop's re-entry, on the schedule that already runs everything else (queue lead 131, the
      # captain's "close the circle"). develop heals and land lands; what was still human was NOTICING that new
      # ore had arrived and running them again. --once keeps this tick bounded — the census reports the work,
      # the landing carries it, and an untaught objection is FILED to lean/circle-findings.json rather than
      # dying in a log, so an unattended stop reaches the sentry and the registrar instead of nobody. It adds
      # no power: the same gated commands, no bypass, nothing sealed the kernel did not prove.
      # ROSTER — THE SCHOOL IS A SESSION TOO, and the truest first entry on the cross-device roster: it runs on
      # a device (this runner), for a purpose, at a ledger height, exactly like every human crew. Announcing
      # here is not ceremony — it is what makes the roster answer "who is touching the tree right now" during
      # the one window when the answer is most often "the schedule, and nobody knew". It departs after the
      # drain so a finished run gives its line back rather than ageing out by drift.
      - name: 'ROSTER — the school announces itself to every device'
        run: |
          node dist/scripts/session.js announce "the resident school — janitor, conveyor, registrar"
          node dist/scripts/session.js roster
      - name: 'CIRCLE — re-enter on the loop''s own verdict; file the stop if there is one'
        continue-on-error: true
        run: |
          node dist/scripts/circle.js --once
      - name: DRAIN — commit and push the derived drift (a quiet run is health)
        run: |
          git config user.name "uuidna-school"
          git config user.email "school@uuidna.com"
          # EXPLICIT PATHS, NEVER -A. `one-receipt stage` stages only what the drain itself regenerates (DRAIN_PATHS)
          # and PRINTS anything else as left-for-a-human. With -A this job committed whatever happened to be in the
          # tree under a message describing the heartbeat — and a commit message here is a signed artifact that must
          # cite a sealed theorem, so it has to mean what it says.
          node dist/scripts/one-receipt.js stage
          # THE SENTRY STANDS THE DRAIN'S WATCH (lead 120's close): after the janitor stages and commits, the
          # sentry delivers - lock-aware, uncensored, no bypass - or reports the exact refusal in this log.
          # On a clean runner it answers in a second: a real exercise every run.
          node dist/scripts/sentry.js 3 || echo "::warning::the sentry could not deliver - its uncensored verdict is above; commits remain on the runner"
          if [ -n "$(git diff --cached --name-only)" ]; then
            git commit -m "Heartbeat: the school verifies itself and drains the derived drift — gate-clean, sessionless. Backed by theorem two_coins"
            git push
            echo "drained and pushed"
            node dist/scripts/session.js depart "the resident school — janitor, conveyor, registrar" || true
          else
            echo "quiet — the tree is a fixed point"
          fi

  registrar:
    runs-on: ubuntu-latest
    needs: janitor
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Install deps
        run: npm install --no-audit --no-fund
      - name: HOMEWORK — the prediction engine reads the ledger and files the school's assignments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm run build
          node dist/scripts/predict-and-fill.js > homework.txt 2>&1 || echo "::warning::predict-and-fill exited nonzero — its full output is in homework.txt; the registrar files what it can (resilience named, not hidden)"
          if grep -q "HIGH LIKELIHOOD" homework.txt; then
            TITLE="The school's homework — gaps the ledger predicts about itself"
            BODY="$(printf 'Filed by the registrar (sessionless, %s). Each item is an exact assignment: fix it, cite a sealed theorem, land it through the gate.\n\n```\n' "$GITHUB_SHA")$(grep -A3 "HIGH LIKELIHOOD" homework.txt | head -40)$(printf '\n```\n\nGraduation: seal a decidable fact and walk the wave — https://uuidna.com/school\n')"
            EXISTING=$(gh issue list --state open --search "in:title The school's homework" --json number --jq '.[0].number // empty')
            if [ -n "$EXISTING" ]; then
              gh issue edit "$EXISTING" --body "$BODY"
              echo "homework refreshed on issue #$EXISTING"
            else
              gh issue create --title "$TITLE" --body "$BODY"
              echo "homework filed"
            fi
          else
            echo "no high-likelihood gaps — the registrar files nothing today"
          fi

  # THE TEACHER IS RESIDENT AND NEEDS NO ORACLE — the rosetta completed: three independent frames, one kernel.
  # The janitor VERIFIES (the fold), the registrar PREDICTS (the gap patterns), and the teacher DISCOVERS — the
  # deterministic self-discovery pass: lean-discover derives the facts the ledger's own algebra implies that no
  # wing yet holds, seals them by decide, and the drain lands them. No external AI, no key, no prompt — the
  # ledger teaches itself from its own structure, exactly as it always discovered (units_iff_invertible,
  # lagrange_units, generators_are_two_and_five were all found this way). Judgment-work stays on the homework
  # issue for any student, human or agent — the paying handle by the two-handle law; the SCHOOL completes itself.
  teacher:
    runs-on: ubuntu-latest
    needs: janitor
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Install deps
        run: npm install --no-audit --no-fund
      - name: TEACH — the resident discovery pass (deterministic, oracle-free)
        run: |
          npm run build
          node dist/scripts/lean-discover.js
          node dist/scripts/predict-and-fill.js || true
          npm run guard
      - name: LAND — a discovered fact drains like any student's work
        run: |
          git config user.name "uuidna-school"
          git config user.email "school@uuidna.com"
          # EXPLICIT PATHS, NEVER -A: the discovery pass writes lean/Discover.lean, and the drain owns the derived
          # layer that follows from it. Anything else in the tree belongs to whoever wrote it.
          # UNCENSORED (lead 120b): the suppression existed because quiet runs mint no Discover.lean —
          # the existence check says that plainly; a real add failure now fails loudly like any other.
          [ -f lean/Discover.lean ] && git add -- lean/Discover.lean
          node dist/scripts/one-receipt.js stage
          if [ -n "$(git diff --cached --name-only)" ]; then
            git commit -m "The school teaches itself — the resident discovery pass sealed what the ledger's own algebra implies, oracle-free: the rosetta's third frame is deterministic. Backed by theorem generators_are_two_and_five and theorem two_coins"
            git pull --rebase --autostash || true
            git push
            echo "the lesson landed"
          else
            echo "quiet — the algebra implies nothing new today; the teacher rests"
          fi
