# uuidna gitleaks config — the scan stays sharp where secrets could live; it stops flagging the repo's own medium.
#
# uuidna is MADE of public 128-bit hex: content-addresses, fold receipts, example HMAC signatures, imprint chains.
# Every one is generated, recomputable, and public by design — the purity guard bans real credentials from the
# tree, and the signatures shown in docs are verification EXAMPLES (a fork recomputes the verdict; only uuidna.com
# can mint the signature — showing one leaks nothing). Allowlisting these classes is honesty about the medium,
# not blindness: workflows, scripts, and source stay fully scanned for real credential shapes.

[extend]
useDefault = true

[allowlist]
description = "generated public artifacts and the uuid/receipt medium — recomputable, never credentials"
paths = [
  '''trials-receipts\.json''',
  '''quantum-fold\.json''',
  '''heartbeats\.json''',
  '''spin-manifest\.json''',
  '''gate-receipt\.json''',
  '''payload-sync\.json''',
  '''audit-citations\.json''',
  '''support-audit\.json''',
  '''research-leads\.json''',
  '''^docs/''',
  # historical build output in old commits (the pre-defaults layout): bundler temp and the dead site dir —
  # generated artifacts frozen in history, unreachable by any secret
  '''^\.vitepress/''',
  '''^scripts/''',
  '''^src/theorems/''',
  '''^site/''',
  '''^src/diamonds/docs/''',
  '''^lean/''',
  '''^src/lean/''',
  '''^src/diamonds/''',
  # the ledger's own artifacts: generated.ts recomputes from Lean (any drift fails the forgery guard), the
  # lean-*.ts generators hold public mathematical constants (seeds, addresses), and gen-prose-evidence emits
  # sealed evidence — no human secret can survive in these files, the guard would flag the drift before the scan
  '''^src/theorems/generated\.ts$''',
  '''^src/scripts/lean-[a-z0-9-]+\.ts$''',
  '''^src/scripts/gen-prose-evidence\.ts$''',
  # HuntCandidate table: sealed theorem names, never credentials. generic-api-key matched
  # `{ key: 'a440_drifts_eight_from_the_lattice' }` in 8b0cd36f; the field is now `theorem`.
  '''^src/scripts/axiom-hunt\.ts$''',
  # THE SAME FINDING, THE SAME MEDIUM, and the reason renaming the field is not enough this time: the conveyor's
  # deposit tables carry sealed theorem KEYS, and generic-api-key scores them on entropy —
  # `key: 'mcp_wire_rate_fell_while_total_grew_32183'`, `key: 'impossibility_claims_debt_622'`,
  # `key: 'impossibility_modal_debt_642'` (5e934c59, 35b56998, dcdaa6c3, all 2026-09-01). The scan runs over FULL
  # HISTORY with fetch-depth 0, so a rename fixes HEAD and leaves the workflow red on commits that are already
  # written; only an allowlist reaches back. A theorem key is a compressed sentence, which is why it scores like
  # a credential and why it is not one: it is public by construction, it names a row anyone can recompute from
  # the Lean, and the forgery guard fails on any drift between the two.
  '''^src/scripts/domains-deposit\.ts$''',
  # the Alpine supply census — generated by gen-alpine-catalogue from public apk indexes; shared-library tags
  # (so:libcrypto.so.3, perl so:…) are package metadata, not credentials, and the file is recomputable upstream
  '''^mirror/alpine-catalogue\.tsv$''',
]
regexes = [
  # a uuid is an address, not a secret — the whole system's unit of speech
  '''[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}''',
]
